plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def releaseStoreFile = System.getenv('PAISATRACK_UPLOAD_STORE_FILE')
def releaseStorePassword = System.getenv('PAISATRACK_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('PAISATRACK_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('PAISATRACK_UPLOAD_KEY_PASSWORD')
def releaseSigningValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def releaseSigningReady = releaseSigningValues.every { it != null && !it.trim().isEmpty() }
if (releaseSigningValues.any { it != null && !it.trim().isEmpty() } && !releaseSigningReady) {
    throw new GradleException('PaisaTrack signing is incomplete. Set all PAISATRACK_UPLOAD_* signing variables, or leave all unset to create an unsigned local release build.')
}

android {
    namespace = 'com.paisatrack.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.paisatrack.app'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    flavorDimensions += 'smsAccess'
    productFlavors {
        manual {
            dimension 'smsAccess'
            buildConfigField 'boolean', 'SMS_IMPORT_AVAILABLE', 'false'
        }
        smsReview {
            dimension 'smsAccess'
            buildConfigField 'boolean', 'SMS_IMPORT_AVAILABLE', 'true'
        }
    }

    signingConfigs {
        if (releaseSigningReady) {
            paisatrackRelease {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            if (releaseSigningReady) {
                signingConfig = signingConfigs.paisatrackRelease
            }
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.06.00')
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}
